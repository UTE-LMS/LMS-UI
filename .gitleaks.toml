# Cấu hình quét secret (gitleaks). Dùng toàn bộ luật mặc định, chỉ thêm ngoại lệ hẹp cho ví dụ giả trong tài liệu.
title = "LMS-UI gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Ví dụ JWT đã cắt ngắn ('...') trong tài liệu hợp đồng API (đầu HS256 của accessToken, đầu RS256 của idToken Google); không phải token thật."
paths = ['''doc/API-CONTRACT\.md''']
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.\.\.''',
  '''eyJhbGciOiJSUzI1NiIs\.\.\.''',
]
condition = "AND"
