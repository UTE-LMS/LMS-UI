<div class="pagination-container">
  <!-- Bên trái: Thông tin tổng quan số lượng bản ghi hiển thị -->
  <div class="pagination-info">
    <span>Hiển thị </span>
    <span class="pagination-highlight">{{ fromItemIndex() }} - {{ toItemIndex() }}</span>
    <span> trên </span>
    <span class="pagination-highlight">{{ pageConfig().totalItem }}</span>
    <span> bản ghi</span>
  </div>

  <!-- Bên phải: Lựa chọn số bản ghi trên trang và bộ điều hướng số trang -->
  <div class="pagination-controls">
    <div class="page-size-wrapper">
      <nz-select
        class="page-size-select"
        [ngModel]="pageConfig().limit"
        (ngModelChange)="onLimitSelect($event)"
        nzSize="small"
        [nzDropdownMatchSelectWidth]="false"
      >
        <nz-option [nzValue]="10" nzLabel="10 / trang"></nz-option>
        <nz-option [nzValue]="20" nzLabel="20 / trang"></nz-option>
        <nz-option [nzValue]="50" nzLabel="50 / trang"></nz-option>
        <nz-option [nzValue]="100" nzLabel="100 / trang"></nz-option>
      </nz-select>
    </div>

    <nz-pagination
      [nzPageIndex]="pageConfig().currentPage"
      [nzTotal]="pageConfig().totalItem"
      [nzPageSize]="pageConfig().limit"
      [nzShowSizeChanger]="false"
      [nzSimple]="false"
      nzSize="small"
      (nzPageIndexChange)="onPageIndexChange($event)"
    ></nz-pagination>
  </div>
</div>
