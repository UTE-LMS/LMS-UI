<div class="youth-login-container py-2">
  <div>
    <h1 class="w-full text-center text-2xl font-bold mb-4 text-slate-900">Đăng nhập</h1>
  </div>

  @if (form) {
  <div class="flex justify-center">
    <form nz-form [formGroup]="form" class="w-full max-w-112.5" (keydown.enter)="$event.preventDefault()" novalidate>
      @if (loginErrorMsg()) {
      <div role="alert" class="login-alert mb-4">{{ loginErrorMsg() }}</div>
      }

      <nz-form-item>
        <nz-form-control [nzValidateStatus]="formValidSvc.displayFieldCssZorro(form, 'username')">
          <label for="login-username" class="sr-only">Tên đăng nhập</label>
          <nz-input-wrapper nz-tooltip nzTooltipTitle="Tên đăng nhập" nzTooltipPlacement="left">
            <i class="fa-solid fa-user text-base mr-1.25 mt-1.25" nzInputPrefix aria-hidden="true"></i>
            <input
              id="login-username"
              type="text"
              class="text-[15px] h-8.75"
              nz-input
              formControlName="username"
              nzSize="large"
              placeholder="Tên đăng nhập"
              autocomplete="username"
              (keyup.enter)="onSubmit()"
            />
          </nz-input-wrapper>
          <app-field-error-display
            [displayError]="formValidSvc.isFieldValid(form, 'username', 'required')"
            errorMsg="Không được để trống"
          />
          <app-field-error-display
            [displayError]="formValidSvc.isFieldValid(form, 'username', 'minlength')"
            errorMsg="Tên đăng nhập có ít nhất 3 ký tự"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-control [nzValidateStatus]="formValidSvc.displayFieldCssZorro(form, 'password')">
          <label for="login-password" class="sr-only">Mật khẩu</label>
          <nz-input-password nz-tooltip nzTooltipTitle="Mật khẩu" nzTooltipPlacement="left">
            <i class="fa-solid fa-lock text-base mr-1.25 mt-1.25" nzInputPrefix aria-hidden="true"></i>
            <input
              id="login-password"
              [attr.type]="showPassLogin() ? 'text' : 'password'"
              class="text-[15px] h-8.75"
              nz-input
              formControlName="password"
              placeholder="Mật khẩu"
              nzSize="large"
              autocomplete="current-password"
              (keyup.enter)="onSubmit()"
            />
            <ng-template nzInputPasswordIcon>
              <i
                (click)="toggleShowPassLogin()"
                role="img"
                [attr.aria-label]="showPassLogin() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
                [class]="showPassLogin() ? 'fa-solid fa-eye-slash text-base mt-1.25 cursor-pointer' : 'fa-solid fa-eye text-base mt-1.25 cursor-pointer'"
              ></i>
            </ng-template>
          </nz-input-password>
          <app-field-error-display
            [displayError]="formValidSvc.isFieldValid(form, 'password', 'required')"
            errorMsg="Không được để trống"
          />
        </nz-form-control>
      </nz-form-item>

      <div nz-row class="items-center">
        <div nz-col nzSpan="12">
          <label nzId="chkbox-remember-me" nz-checkbox [nzChecked]="true">
            <span>Ghi nhớ đăng nhập</span>
          </label>
        </div>
        <div class="text-right" nz-col nzSpan="12">
          <a id="lnk-forgot-pass" href="javascript:void(0);">Quên mật khẩu?</a>
        </div>
      </div>

      <div nz-row nzJustify="center" class="mt-3">
        <div nz-col nzSpan="24" class="text-center">
          <button
            id="btn-login"
            nz-button
            type="button"
            class="cursor-pointer px-8"
            nzType="primary"
            nzSize="large"
            [nzLoading]="isSubmitting()"
            [disabled]="isSubmitting()"
            (click)="onSubmit()"
          >
            <span>Đăng nhập</span>
          </button>
        </div>
      </div>

      @if (googleEnabled) {
      <div nz-row nzJustify="center">
        <nz-divider nzDashed [nzText]="textOr">
          <ng-template #textOr><span>Hoặc</span></ng-template>
        </nz-divider>
        <div id="google-signin" nz-col nzSpan="24" class="flex justify-center mt-2.5">
          <asl-google-signin-button type="standard" size="large" text="signin_with" shape="rectangular" [width]="320" locale="vi" />
        </div>
      </div>
      }
    </form>
  </div>
  }
</div>
