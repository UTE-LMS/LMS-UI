<nz-layout class="min-h-screen">
  <nz-sider nzCollapsible [nzCollapsedWidth]="0" nzTheme="light" [nzWidth]="sliderWidth()">
    <app-management-sidebar />
  </nz-sider>
  <nz-layout class="[background:url('assets/img/bg/bg-pattern.png')]">
    <nz-header class="pr-5 pl-10 xl:pl-5 pt-0 pb-0 bg-primary text-white">
      <app-management-header />
    </nz-header>
    <nz-content class="pt-6 pb-0 pl-4 pr-4">
      <div class="bg-white min-h-75 p-4 mt-4.5">
        <router-outlet></router-outlet>
      </div>
    </nz-content>
    <nz-footer class="text-center pl-1 pr-12.5 pt-2 pb-2 bg-white-dark">
      <app-management-footer />
    </nz-footer>
  </nz-layout>
</nz-layout>
