<header class="header-navbar">
  <!-- Bên trái: Logo trường + Tên hệ thống + Menu điều hướng -->
  <div class="header-left">
    <a [routerLink]="urlConst.ROUTE.MANAGEMENT.DASHBOARD" class="header-brand">
      <img src="assets/img/logo/ute_logo.png" alt="HCMUTE" class="header-logo" />
      <span class="brand-title">OBE</span>
    </a>

    <!-- Menu điều hướng các chức năng đang có (khớp bố cục UI.pdf) -->
    <nav class="header-nav" aria-label="Main Navigation">
      @for (item of visibleNavItems(); track item.routerLink) {
      <a
        [routerLink]="item.routerLink"
        routerLinkActive="nav-active"
        [routerLinkActiveOptions]="{ exact: item.routerLink === urlConst.ROUTE.MANAGEMENT.DASHBOARD }"
        class="nav-link"
      >
        <span class="nav-dot" aria-hidden="true">•</span>
        <span class="nav-text">{{ item.title }}</span>
      </a>
      }
    </nav>
  </div>

  <!-- Bên phải: Nhãn thử nghiệm + Thông tin người dùng đăng nhập & Đăng xuất -->
  <div class="header-right">
    <!-- Người dùng đăng nhập: Bấm vào hiển thị dropdown menu chứa nút Đăng xuất -->
    <div
      class="user-profile-trigger"
      nz-dropdown
      [nzDropdownMenu]="menuUser"
      [nzTrigger]="'click'"
      [nzPlacement]="'bottomRight'"
      role="button"
      tabindex="0"
      [attr.aria-label]="'Tài khoản ' + username()"
    >
      <div class="role-avatar-circle" [title]="roleTitle()">
        {{ roleBadgeText() }}
      </div>
      <span class="user-name-label">{{ username() || 'user' }}</span>
      <i class="fa-solid fa-chevron-down text-xs text-sky-200/70 ml-1"></i>
    </div>

    <!-- Dropdown Menu tài khoản -->
    <nz-dropdown-menu #menuUser="nzDropdownMenu">
      <ul nz-menu class="user-menu-dropdown shadow-lg rounded-md border border-gray-100 min-w-56">
        <li class="px-4 py-2.5 bg-gray-50/80 border-b border-gray-100">
          <div class="font-semibold text-gray-900 leading-tight">
            {{ fullName() || username() }}
          </div>
          <div class="text-xs text-gray-500 mt-0.5">
            {{ roleTitle() }} · {{ username() }}
          </div>
        </li>
        <li nz-menu-divider></li>
        <li
          nz-menu-item
          class="logout-menu-item px-4 py-2 text-sm text-red-600 hover:bg-red-50 cursor-pointer flex items-center gap-2"
          (click)="doLogout()"
        >
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <span>Đăng xuất</span>
        </li>
      </ul>
    </nz-dropdown-menu>
  </div>
</header>
