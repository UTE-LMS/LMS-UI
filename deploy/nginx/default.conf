# SPA tĩnh: mọi đường dẫn không phải tệp đều trả index.html để Angular Router xử lý (ADR 0001).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  include /etc/nginx/snippets/security-headers.conf;

  # Kiểm tra sống cho HEALTHCHECK của container và bước health check sau deploy
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Cấu hình runtime do entrypoint sinh ra ở /tmp (cho phép chạy với hệ tệp chỉ đọc); không được cache
  location = /config.js {
    alias /tmp/runtime-config/config.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Tệp cần luôn kiểm tra lại để người dùng nhận bản mới và service worker cập nhật đúng
  location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|version\.txt|manifest\.json)$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Tệp đã băm tên (Angular outputHashing=all) cache dài hạn
  location ~* "-[A-Za-z0-9]{8}\.(js|css|woff2?|ttf|png|jpe?g|svg|ico)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Không phát hành source map
  location ~* \.map$ {
    return 404;
  }

  # Tệp tĩnh không tồn tại phải là 404, không được trả index.html (tránh trình duyệt nhận HTML thay vì ảnh/script)
  location ~* \.(js|mjs|css|json|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|otf|pdf|txt|xml|webmanifest)$ {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
