# Cấu hình SonarCloud cho LMS-UI. KHÔNG chứa token: SONAR_TOKEN lấy từ secret của GitHub.
# sonar.organization và sonar.projectKey do CI truyền từ biến repository SONAR_ORGANIZATION và SONAR_PROJECT_KEY
# (xem .github/workflows/ci.yml và doc/testing-and-quality.md), để không đoán sẵn định danh dự án.
sonar.host.url=https://sonarcloud.io

# Mã nguồn ứng dụng; tài nguyên bên thứ ba trong src/assets (latex.js, katex, tinymce...) không phải mã của nhóm
sonar.sources=src
sonar.exclusions=src/assets/**,**/*.spec.ts
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Báo cáo coverage do `npm run test:ci` tạo ra (angular.json: coverageReporters lcovonly)
sonar.javascript.lcov.reportPaths=coverage/LMS-UI/lcov.info
# Không tính coverage cho tệp cấu hình môi trường
sonar.coverage.exclusions=src/environments/**,src/main.ts

sonar.sourceEncoding=UTF-8
