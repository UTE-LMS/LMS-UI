<div>
  <div>
    <h2 class="w-full text-center">{{langData.DAT_LAI_MAT_KHAU}}</h2>
    <!-- Toolbar here -->
  </div>
  <div class="flex justify-center">
    <form nz-form [formGroup]="form" class="w-full max-w-112.5">
      <nz-form-item>
        <nz-form-control [nzValidateStatus]="formValidSvc.displayFieldCssZorro(form, 'password')">
          <nz-input-password [nzTooltipTitle]="langData.MAT_KHAU" nzTooltipPlacement="left"
            nz-tooltip>
            <i class="fa-solid fa-lock text-base mr-1.25 mt-1.2" nzInputPrefix></i>
            <input [attr.type]="showPass() ? 'text' : 'password'" class="text-[15px] h-8.75"
              nz-input formControlName="password" [attr.placeholder]="langData.MAT_KHAU"
              nzSize="large" />
            <ng-template nzInputPasswordIcon>
              <i (click)="toggleShowPassLogin()"
                [class]="showPass() ? 'fa-solid fa-eye-slash text-base mt-1.25 cursor-pointer' : 'fa-solid fa-eye text-base mt-1.25 cursor-pointer'"></i>
            </ng-template>
          </nz-input-password>
          <app-field-error-display
            [displayError]="formValidSvc.isFieldValid(form, 'password', 'required')"
            [errorMsg]="langData.CHUA_NHAP_MAT_KHAU" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-control [nzValidateStatus]="formValidSvc.displayFieldCssZorro(form, 'repassword')">
          <nz-input-password [nzTooltipTitle]="langData.NHAP_LAI_MAT_KHAU" nzTooltipPlacement="left"
            nz-tooltip>
            <i class="fa-solid fa-lock text-base mr-1.25 mt-1.2" nzInputPrefix></i>
            <input [attr.type]="showPass() ? 'text' : 'password'" class="text-[15px] h-8.75"
              nz-input formControlName="repassword" [attr.placeholder]="langData.NHAP_LAI_MAT_KHAU"
              nzSize="large" />
            <ng-template nzInputPasswordIcon>
              <i (click)="toggleShowPassLogin()"
                [class]="showPass() ? 'fa-solid fa-eye-slash text-base mt-1.25 cursor-pointer' : 'fa-solid fa-eye text-base mt-1.25 cursor-pointer'"></i>
            </ng-template>
          </nz-input-password>
          <app-field-error-display
            [displayError]="formValidSvc.isFieldValid(form, 'repassword', 'required')"
            [errorMsg]="langData.CHUA_NHAP_MAT_KHAU" />
          <app-field-error-display
            [displayError]="formValidSvc.isFieldValid(form, 'repassword', 'mustMatch')"
            [errorMsg]="langData.MAT_KHAU_CHUA_KHOP" />
        </nz-form-control>
      </nz-form-item>
      <div nz-row nzJustify="center" class="mt-2.5">
        <div nz-col nzSpan="24" class="text-center">
          <button nz-button type="button" class="cursor-pointer" [nzType]="'primary'" nzSize="large"
            (click)="onResetPass()">
            <span>{{langData.CAP_NHAT}}</span></button>
        </div>
      </div>
    </form>
  </div>
</div>
