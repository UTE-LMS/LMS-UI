<form nz-form [formGroup]="form" class="w-full max-w-112.5" (keydown.enter)="$event.preventDefault()" novalidate>
  @if (errorMsg()) {
  <div role="alert" class="mb-4 px-3.5 py-2.5 rounded-md border border-red-200 bg-red-50 text-red-800">{{ errorMsg() }}</div>
  }

  <nz-form-item>
    <nz-form-control [nzValidateStatus]="formValidSvc.displayFieldCssZorro(form, 'currentPassword')">
      <label for="cp-current" class="sr-only">Mật khẩu hiện tại</label>
      <nz-input-password>
        <i class="fa-solid fa-lock text-base mr-1.25 mt-1.25" nzInputPrefix aria-hidden="true"></i>
        <input id="cp-current" type="password" class="text-[15px] h-8.75" nz-input formControlName="currentPassword"
          nzSize="large" placeholder="Mật khẩu hiện tại" autocomplete="current-password" (keyup.enter)="onSubmit()" />
      </nz-input-password>
      <app-field-error-display [displayError]="formValidSvc.isFieldValid(form, 'currentPassword', 'required')"
        errorMsg="Không được để trống" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-control [nzValidateStatus]="formValidSvc.displayFieldCssZorro(form, 'newPassword')">
      <label for="cp-new" class="sr-only">Mật khẩu mới</label>
      <nz-input-password>
        <i class="fa-solid fa-key text-base mr-1.25 mt-1.25" nzInputPrefix aria-hidden="true"></i>
        <input id="cp-new" type="password" class="text-[15px] h-8.75" nz-input formControlName="newPassword"
          nzSize="large" placeholder="Mật khẩu mới" autocomplete="new-password" (keyup.enter)="onSubmit()" />
      </nz-input-password>
      <app-field-error-display [displayError]="formValidSvc.isFieldValid(form, 'newPassword', 'required')"
        errorMsg="Không được để trống" />
      <app-field-error-display [displayError]="formValidSvc.isFieldValid(form, 'newPassword', 'minlength')"
        [errorMsg]="'Mật khẩu mới có ít nhất ' + minLength + ' ký tự'" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-control [nzValidateStatus]="formValidSvc.displayFieldCssZorro(form, 'confirmPassword')">
      <label for="cp-confirm" class="sr-only">Nhập lại mật khẩu mới</label>
      <nz-input-password>
        <i class="fa-solid fa-key text-base mr-1.25 mt-1.25" nzInputPrefix aria-hidden="true"></i>
        <input id="cp-confirm" type="password" class="text-[15px] h-8.75" nz-input formControlName="confirmPassword"
          nzSize="large" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" (keyup.enter)="onSubmit()" />
      </nz-input-password>
      <app-field-error-display [displayError]="formValidSvc.isFieldValid(form, 'confirmPassword', 'required')"
        errorMsg="Không được để trống" />
      <app-field-error-display [displayError]="formValidSvc.isFieldValid(form, 'confirmPassword', 'mustMatch')"
        errorMsg="Mật khẩu nhập lại chưa khớp" />
    </nz-form-control>
  </nz-form-item>

  <div class="text-center mt-3">
    <button id="btn-change-password" nz-button type="button" class="cursor-pointer px-8" nzType="primary" nzSize="large"
      [nzLoading]="isSubmitting()" [disabled]="isSubmitting()" (click)="onSubmit()">
      <span>Đổi mật khẩu</span>
    </button>
  </div>
</form>
