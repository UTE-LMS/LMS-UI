<div class="py-2">
  <h1 class="w-full text-center text-2xl font-bold mb-2 text-slate-900">Đổi mật khẩu lần đầu</h1>
  <p class="text-center text-slate-600 mb-4">
    Tài khoản của bạn do quản trị viên tạo. Vui lòng đặt mật khẩu mới để tiếp tục sử dụng hệ thống.
  </p>

  @if (ready()) {
  <div class="flex justify-center">
    <div class="w-full max-w-112.5">
      <app-change-password-form (changed)="onChanged()" />
      <div class="text-center mt-3">
        <a id="lnk-logout" href="javascript:void(0);" (click)="onLogout()">Đăng xuất</a>
      </div>
    </div>
  </div>
  }
</div>
